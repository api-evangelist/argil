description: Argil (Argil AI) is an AI avatar video generation platform for the creator
  economy. Its API programmatically produces talking-avatar videos from text or audio,
  clones custom avatars and voices, manages B-roll assets, and delivers render events
  via webhooks - turning a script into a finished, subtitled avatar video.
