aid: argil
url: https://raw.githubusercontent.com/api-evangelist/argil/refs/heads/main/apis.yml
name: Argil
kind: company
description: Argil (Argil AI) is an AI avatar video generation platform for the creator
  economy. Its API programmatically produces talking-avatar videos from text or audio,
  clones custom avatars and voices, manages B-roll assets, and delivers render events
  via webhooks - turning a script into a finished, subtitled avatar video.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- Video Generation
- Avatars
- Voice Cloning
- Content Automation
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
apis:
- aid: argil:argil-videos-api
  name: Argil Videos API
  tags:
  - Video
  - Generation
  - Rendering
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
