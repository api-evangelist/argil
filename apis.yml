    type: APIReference
  - url: openapi/argil-openapi.yml
    type: OpenAPI
  - url: collections/argil.postman_collection.json
    type: PostmanCollection
  - url: collections/argil.opencollection.json
    type: OpenCollection
  description: Create, render, retrieve, list, and delete avatar videos. A video is
    defined as a set of moments (transcript or audio) mapped to an avatar and voice,
    with subtitles, aspect ratio, auto B-rolls, and background music, then rendered
    asynchronously into an MP4.
