providerId: argil
created: '2026-07-01'
modified: '2026-07-01'
reconciled: true
tags:
- AI
- Video Generation
- Avatars
- Voice Cloning
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Argil spend. Argil bills a flat monthly (or discounted annual)
  subscription per tier, and each tier includes a monthly pool of credits that
  are consumed as avatar videos are generated (~1,600 credits per 25 minutes).
  Cost is driven primarily by minutes/credits of video rendered; avatar and
  voice cloning are included with the subscription. Enterprise is a negotiated
  contract with custom credits.
notes: >-
  Credit allotments and conversion ratios are subject to change; verify against
  the Argil pricing page during reconciliation.
sources:
- https://www.argil.ai/pricing
- https://docs.argil.ai/api-reference/introduction
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Argil
serviceCategory: AI and Machine Learning
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
focusColumns:
  ServiceName: Argil
  ServiceCategory: AI and Machine Learning
  ProviderName: Argil
  PublisherName: Argil
  InvoiceIssuerName: Argil
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription
meters:
- name: subscription_fee
  description: Flat monthly or annual subscription fee per tier (Classic/Pro/Scale/Enterprise).
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - tier
- name: video_credits
  description: Credits consumed generating avatar videos; ~1,600 credits per 25 minutes.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - video
- name: video_minutes
  description: Minutes of finished avatar video rendered, derived from credit burn.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - avatar
- name: workspace_seats
  description: Number of workspace seats provisioned (Scale and Enterprise tiers).
  unit: seats
  aggregation: max
  dimensions:
  - account
principles:
- name: Visibility
  description: Track monthly credit burn against the tier allotment in the Argil dashboard.
- name: Allocation
  description: Tag API keys per workload/team and map video renders to internal cost centers via extras metadata.
- name: Optimization
  description: >-
    Keep moments within the 500-char / 40s limits to avoid wasted renders, reuse
    cloned avatars and voices, and right-size the tier to actual monthly minutes.
- name: Accountability
  description: Assign an owner per workspace/key and review credit consumption monthly against budget.
maintainers:
